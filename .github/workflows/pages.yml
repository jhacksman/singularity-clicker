name: Publish project website
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node for the browser game
        if: ${{ hashFiles('build.mjs') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build browser game when its source is present
        shell: bash
        run: |
          set -euo pipefail
          if [ -f build.mjs ]; then
            if [ -d tests ]; then
              node --test tests/*.test.cjs
            fi
            node build.mjs
            test -f dist/index.html
            test -f dist/hearth.html
            mkdir -p website/play
            cp -R dist/. website/play/
            printf '\ngame_available: true\n' >> website/_config.yml
          fi
      - name: Build Jekyll website
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./website
          destination: ./_site
      - name: Verify the generated pages
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/design/index.html
          test -s _site/assets/site.css
          if [ -f build.mjs ]; then
            test -s _site/play/index.html
            test -s _site/play/hearth.html
          fi
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages configuration
        uses: actions/configure-pages@v5
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
